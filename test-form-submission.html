<!DOCTYPE html>
<html>
<head>
    <title>Test Form Submission</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h3>Test Form Submission</h3>
        
        <div class="alert alert-info">
            <strong>Testing Steps:</strong>
            <ol>
                <li>Select a Jenjang Pendidikan (try "Diploma (D3)" or "Sarjana (S1)")</li>
                <li>Wait for Program Studi dropdown to populate</li>
                <li>Select a Program Studi</li>
                <li>Fill other required fields</li>
                <li>Check if form can submit without JavaScript errors</li>
            </ol>
        </div>
        
        <form action="http://127.0.0.1:8000/pendaftar/pendaftaran" method="POST">
            <input type="hidden" name="_token" value="{{ csrf_token() }}">
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="jenjang_id">Jenjang Pendidikan *</label>
                    <select class="form-control" name="jenjang_id" id="jenjang_id" required>
                        <option value="">Pilih Jenjang Pendidikan</option>
                        <option value="1">Diploma (D3)</option>
                        <option value="2">Sarjana (S1)</option>
                    </select>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="program_studi_id">Program Studi *</label>
                    <select class="form-control" name="program_studi_id" id="program_studi_id" required>
                        <option value="">Pilih Jenjang Dulu</option>
                    </select>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="nama_lengkap">Nama Lengkap *</label>
                    <input type="text" class="form-control" name="nama_lengkap" id="nama_lengkap" value="John Doe Test" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="no_hp">Nomor HP *</label>
                    <input type="text" class="form-control" name="no_hp" id="no_hp" value="081234567890" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="nik">NIK *</label>
                    <input type="text" class="form-control" name="nik" id="nik" value="1234567890123456" maxlength="16" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="jenis_kelamin">Jenis Kelamin *</label>
                    <select class="form-control" name="jenis_kelamin" id="jenis_kelamin" required>
                        <option value="">Pilih Jenis Kelamin</option>
                        <option value="Laki-laki" selected>Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="agama">Agama *</label>
                    <select class="form-control" name="agama" id="agama" required>
                        <option value="">Pilih Agama</option>
                        <option value="Islam" selected>Islam</option>
                        <option value="Kristen">Kristen</option>
                        <option value="Katolik">Katolik</option>
                        <option value="Hindu">Hindu</option>
                        <option value="Buddha">Buddha</option>
                        <option value="Konghucu">Konghucu</option>
                    </select>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="tempat_lahir">Tempat Lahir *</label>
                    <input type="text" class="form-control" name="tempat_lahir" id="tempat_lahir" value="Jakarta" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="tanggal_lahir">Tanggal Lahir *</label>
                    <input type="date" class="form-control" name="tanggal_lahir" id="tanggal_lahir" value="2000-01-01" required>
                </div>
                
                <div class="col-12 mb-3">
                    <label class="form-label" for="alamat_lengkap">Alamat Lengkap *</label>
                    <textarea class="form-control" name="alamat_lengkap" id="alamat_lengkap" required>Jl. Test No. 123</textarea>
                </div>
                
                <div class="col-md-2 mb-3">
                    <label class="form-label" for="rt">RT *</label>
                    <input type="text" class="form-control" name="rt" id="rt" value="001" maxlength="3" required>
                </div>
                
                <div class="col-md-2 mb-3">
                    <label class="form-label" for="rw">RW *</label>
                    <input type="text" class="form-control" name="rw" id="rw" value="002" maxlength="3" required>
                </div>
                
                <div class="col-md-4 mb-3">
                    <label class="form-label" for="desa_kelurahan">Desa/Kelurahan *</label>
                    <input type="text" class="form-control" name="desa_kelurahan" id="desa_kelurahan" value="Test Village" required>
                </div>
                
                <div class="col-md-4 mb-3">
                    <label class="form-label" for="kecamatan">Kecamatan *</label>
                    <input type="text" class="form-control" name="kecamatan" id="kecamatan" value="Test District" required>
                </div>
                
                <div class="col-md-4 mb-3">
                    <label class="form-label" for="kota_kabupaten">Kota/Kabupaten *</label>
                    <input type="text" class="form-control" name="kota_kabupaten" id="kota_kabupaten" value="Jakarta" required>
                </div>
                
                <div class="col-md-4 mb-3">
                    <label class="form-label" for="provinsi">Provinsi *</label>
                    <input type="text" class="form-control" name="provinsi" id="provinsi" value="DKI Jakarta" required>
                </div>
                
                <div class="col-md-4 mb-3">
                    <label class="form-label" for="kode_pos">Kode Pos *</label>
                    <input type="text" class="form-control" name="kode_pos" id="kode_pos" value="12345" maxlength="5" required>
                </div>
                
                <!-- Required fields from original form -->
                <input type="hidden" name="jalur_id" value="1">
                <input type="hidden" name="gelombang_id" value="1">
                <input type="hidden" name="jenis_id" value="1">
            </div>
            
            <div class="row">
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Submit Test</button>
                    <button type="button" class="btn btn-secondary" onclick="testDropdown()">Test Dropdown Only</button>
                </div>
            </div>
            
        </form>
        
        <div class="row mt-4">
            <div class="col-12">
                <h5>Debug Info:</h5>
                <div id="debug" style="background: #f8f9fa; padding: 10px; border-radius: 5px; height: 200px; overflow-y: scroll;"></div>
            </div>
        </div>
    </div>

    <script>
    function log(message) {
        const debug = document.getElementById('debug');
        debug.innerHTML += new Date().toLocaleTimeString() + ': ' + message + '<br>';
        debug.scrollTop = debug.scrollHeight;
    }

    function testDropdown() {
        log('Testing dropdown functionality...');
        const jenjangSelect = document.getElementById('jenjang_id');
        jenjangSelect.value = '1';
        jenjangSelect.dispatchEvent(new Event('change'));
    }

    document.addEventListener('DOMContentLoaded', function() {
        log('DOM loaded');
        
        const jenjangSelect = document.getElementById('jenjang_id');
        const prodiSelect = document.getElementById('program_studi_id');
        
        log('Elements found: jenjang=' + (jenjangSelect ? 'YES' : 'NO') + ', prodi=' + (prodiSelect ? 'YES' : 'NO'));
        
        if (jenjangSelect && prodiSelect) {
            jenjangSelect.addEventListener('change', function() {
                const jenjangId = this.value;
                log('Jenjang changed to: ' + jenjangId);
                
                prodiSelect.innerHTML = '<option value="">Loading...</option>';
                
                if (jenjangId) {
                    const url = 'http://127.0.0.1:8000/test-prodi/' + jenjangId;
                    log('Fetching from: ' + url);
                    
                    fetch(url)
                        .then(response => {
                            log('Response status: ' + response.status);
                            return response.json();
                        })
                        .then(data => {
                            log('Data received: ' + JSON.stringify(data));
                            
                            prodiSelect.innerHTML = '<option value="">Pilih Program Studi</option>';
                            
                            data.forEach(prodi => {
                                const option = document.createElement('option');
                                option.value = prodi.id;
                                option.textContent = prodi.name + ' (' + prodi.code + ')';
                                prodiSelect.appendChild(option);
                            });
                            
                            log('Options added: ' + data.length);
                        })
                        .catch(error => {
                            log('Error: ' + error.message);
                            prodiSelect.innerHTML = '<option value="">Error loading data</option>';
                        });
                } else {
                    prodiSelect.innerHTML = '<option value="">Pilih Jenjang Dulu</option>';
                }
            });
        }
    });
    </script>
</body>
</html>
